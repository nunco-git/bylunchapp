<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀별 선착순 접수 · 200명 추첨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161b;
    --panel: #1c1f26;
    --led-amber: #ffb627;
    --led-red: #ff5c5c;
    --led-green: #43d9a3;
    --paper: #f0e8d4;
    --ink: #221d14;
    --ink-soft: #6b6255;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #23283566 0%, transparent 50%),
      radial-gradient(circle at 100% 0%, #1f2a2555 0%, transparent 45%),
      var(--bg);
    color:#e9e6dd;
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 60px;
  }
  .digits{font-family:'Chakra Petch', monospace;}
  .wrap{width:100%;max-width:420px;}

  .board{
    background:var(--panel);
    border:1px solid #2c303a;
    border-radius:14px;
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 0 40px #00000055, 0 8px 24px #00000066;
  }
  .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--led-green);text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--led-green);box-shadow:0 0 8px var(--led-green);}
  .title{font-size:19px;font-weight:900;margin:6px 0 4px;letter-spacing:-0.01em;}
  .datestr{font-size:12px;color:#8f8a7c;margin-bottom:14px;}
  .counter-row{display:flex;align-items:baseline;justify-content:space-between;background:#0e0f13;border-radius:10px;padding:14px 16px;border:1px solid #2c303a;}
  .counter-num{font-size:36px;font-weight:700;color:var(--led-amber);text-shadow:0 0 14px #ffb62755, 0 0 2px #ffb627;}
  .counter-num span.total{color:#5a5546;font-size:22px;margin-left:2px;}
  .counter-label{font-size:12px;color:#8f8a7c;text-align:right;line-height:1.5;}
  .subrow{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#a7a196;}
  .subrow b{color:var(--led-amber);font-weight:700;}

  .card{background:var(--panel);border:1px solid #2c303a;border-radius:14px;padding:22px 18px;margin-top:14px;}
  .card h2{font-size:15px;margin:0 0 12px;color:#e9e6dd;font-weight:700;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:#a7a196;margin-bottom:6px;}
  input[type=text], input[type=number], input[type=password], input[type=time], select{
    width:100%;background:#0e0f13;border:1px solid #33384280;color:#e9e6dd;border-radius:8px;
    padding:12px 12px;font-size:15px;font-family:inherit;outline:none;
  }
  select{ appearance:auto; }
  input:focus, select:focus{border-color:var(--led-amber);}
  .btn{width:100%;padding:14px;border-radius:9px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR', sans-serif;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--led-amber);color:#221a06;}
  .btn-primary:disabled{background:#4a4638;color:#8a8578;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid #3a3f4a;color:#c8c3b6;margin-top:8px;}
  .btn-danger{background:var(--led-red);color:#2a0808;}
  .helper{font-size:12px;color:#79746a;margin-top:8px;line-height:1.5;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;background:#2a2416;color:var(--led-amber);border:1px solid #4a3f22;}

  .pulse-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0 10px;}
  .pulse{width:10px;height:10px;border-radius:50%;background:var(--led-amber);animation:pulse 1.2s infinite ease-in-out;}
  .pulse:nth-child(2){animation-delay:.2s;} .pulse:nth-child(3){animation-delay:.4s;}
  @keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(0.8);}40%{opacity:1; transform:scale(1);}}
  .waiting-txt{text-align:center;font-size:13px;color:#a7a196;padding-bottom:6px;}

  /* Ticket with daily watermark */
  .ticket{
    margin-top:16px;
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:26px 20px 20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px #00000066;
    border-top:5px solid var(--dayhue, #cf9f3f);
  }
  .ticket::before, .ticket::after{
    content:"";position:absolute; left:0; right:0; height:14px;
    background:
      radial-gradient(circle 7px at 10px 7px, var(--bg) 99%, transparent 100%) repeat-x,
      radial-gradient(circle 7px at 30px 7px, var(--bg) 99%, transparent 100%) repeat-x;
    background-size:20px 14px;
  }
  .ticket::before{top:-1px;} .ticket::after{bottom:-1px; transform:rotate(180deg);}
  .watermark{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-evenly;
  }
  .watermark div{
    white-space:nowrap; font-size:13px; font-weight:700; letter-spacing:.15em;
    transform:rotate(-18deg) scale(1.4); opacity:0.16;
    color:var(--dayhue, #cf9f3f);
  }
  .t-content{position:relative;z-index:1;}
  .t-eyebrow{font-size:11px;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase;font-weight:700;text-align:center;}
  .t-stamp{text-align:center;font-size:24px;font-weight:900;margin:10px 0 4px;letter-spacing:.02em;}
  .t-stamp.win{color:#a3752a;} .t-stamp.lose{color:#8b3b3b;}
  .t-num{text-align:center;font-size:52px;font-weight:700;margin:6px 0 2px;color:var(--ink);}
  .t-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .t-divider{border-top:1px dashed #22201866; margin:14px 0;}
  .t-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:3px 0;}
  .t-row b{color:var(--ink);font-weight:700;}
  .t-note{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--ink);background:#00000010;border-radius:6px;padding:10px 12px;}
  .daychip{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; background:var(--dayhue,#cf9f3f); color:#1c1400;
    position:absolute; top:14px; right:14px; z-index:2;
  }

  /* Full-screen result ticket */
  .ticket-full{
    position:fixed; inset:0; z-index:80;
    margin:0; border-radius:0;
    padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0);
    display:flex; flex-direction:column; justify-content:center; align-items:stretch;
    overflow-y:auto;
  }
  .ticket-full .t-content{width:100%; max-width:520px; margin:0 auto;}
  .ticket-full .t-date-big{
    text-align:center; font-weight:700; letter-spacing:.04em;
    font-size:clamp(16px, 5vw, 22px); color:var(--ink-soft); margin-bottom:6px;
  }
  .ticket-full .t-stamp{
    font-size:clamp(28px, 9vw, 44px); margin:4px 0 8px;
  }
  .ticket-full .t-num{
    font-size:clamp(48px, 19vw, 108px);
    line-height:1; margin:4px 0 6px;
    white-space:nowrap;
  }
  .ticket-full .t-sub{ font-size:clamp(14px, 4vw, 17px); margin-bottom:20px; }
  .ticket-full .t-team{
    text-align:center; font-weight:900; color:var(--ink);
    font-size:clamp(34px, 12vw, 58px); line-height:1.15; margin-bottom:10px; word-break:keep-all;
  }
  .ticket-full .t-count{
    text-align:center; font-weight:700; color:var(--ink);
    font-size:clamp(28px, 9vw, 44px); margin-bottom:22px;
  }
  .ticket-full .t-divider{ margin:18px 0; }
  .ticket-full .t-row{ font-size:clamp(12px, 3.6vw, 15px); padding:5px 0; }
  .ticket-full .t-note{ font-size:clamp(12px, 3.4vw, 14.5px); margin-top:18px; }
  .ticket-full .daychip{ font-size:clamp(11px, 3vw, 13px); padding:6px 14px; }
  .ticket-close{
    position:absolute; top:14px; left:14px; z-index:3;
    background:#00000018; border:none; color:var(--ink); font-size:13px; font-weight:700;
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }

  .list-toggle{display:block;text-align:center;font-size:13px;color:#a7a196;margin-top:16px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .list-panel{margin-top:10px;background:var(--panel);border:1px solid #2c303a;border-radius:12px;padding:14px;max-height:340px;overflow-y:auto;}
  .list-head{font-size:11px;color:#79746a;display:flex;padding:0 4px 8px;border-bottom:1px solid #2c303a;margin-bottom:4px;}
  .list-head span:nth-child(1){width:74px;}
  .list-head span:nth-child(2){flex:1;}
  .list-head span:nth-child(3){width:44px;text-align:right;}
  .list-row{display:flex;gap:10px;align-items:center;padding:7px 4px;font-size:13px;border-bottom:1px solid #2c303a55;}
  .list-row:last-child{border-bottom:none;}
  .list-row .n{font-family:'Chakra Petch',monospace;font-weight:700;color:var(--led-amber);width:74px;flex-shrink:0;font-size:12px;}
  .list-row .nm{color:#d8d4c8;flex:1;}
  .list-row .ct{color:#a7a196;width:44px;text-align:right;}
  .list-empty{font-size:12px;color:#79746a;text-align:center;padding:14px 0;}

  .admin-toggle{text-align:center;font-size:11px;color:#4a4638;margin-top:26px;cursor:pointer;}
  .admin-panel{margin-top:10px;border:1px dashed #3a3f4a;border-radius:12px;padding:14px;background:#181a20;}
  .admin-panel h3{font-size:13px;margin:0 0 10px;color:#c8c3b6;}
  .admin-row{display:flex;gap:8px;margin-bottom:10px;}
  .admin-row input{flex:1;}
  .small-btn{padding:10px 12px;font-size:13px;border-radius:7px;}
  .admin-status{font-size:12px;color:#8f8a7c;margin-top:6px;line-height:1.6;}

  footer{margin-top:30px;font-size:11px;color:#3f3c34;text-align:center;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="board">
    <div class="eyebrow"><span class="dot"></span><span id="statusLabel">접수 중</span></div>
    <div class="title">팀별 선착순 접수 · 사다리 추첨</div>
    <div class="datestr" id="dateStr">-</div>
    <div class="counter-row">
      <div class="counter-num digits" id="countNum">0<span class="total">/200</span></div>
      <div class="counter-label">누적 인원<br>당첨 정원 <span id="winCapLabel">120</span>명</div>
    </div>
    <div class="subrow"><span>접수 팀 수 <b id="teamCount">0</b>팀</span><span>마감 <b id="deadlineText">11:00</b></span></div>
  </div>

  <div id="mainArea"></div>
  <div id="listToggleArea"></div>
  <div class="admin-toggle" id="adminToggleBtn">관리자</div>
  <div id="adminArea"></div>

  <footer>참여 현황과 추첨 결과는 이 페이지를 여는 모든 사람에게 동일하게 공유됩니다. 매일 자정 기준 새 접수가 시작됩니다.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getDatabase, ref, get, set, push, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYsIb9HUyIOCYrBvGCEcvcCHDfZ6CHkLk",
  authDomain: "gen-lang-client-0475437247.firebaseapp.com",
  databaseURL: "https://gen-lang-client-0475437247-default-rtdb.firebaseio.com",
  projectId: "gen-lang-client-0475437247",
  storageBucket: "gen-lang-client-0475437247.firebasestorage.app",
  messagingSenderId: "334305902694",
  appId: "1:334305902694:web:8e0d352810cdcd9b49ada7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CAP_DEFAULT = 200;
const WINCAP_DEFAULT = 120;

let state = {
  date: null,
  teams: [],
  draw: null,
  config: { startHour: 9, startMinute: 0, hour: 11, minute: 0, cap: CAP_DEFAULT, winCap: WINCAP_DEFAULT },
  roster: { entries: [] },
  rosterPreview: null,
  rosterUploadMsg: null,
  myEntry: null,
  listOpen: false,
  adminOpen: false,
  adminUnlocked: false,
  busy: false,
  errorMsg: null
};

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function hueForDate(dateStr){
  let h = 0;
  for(let i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i)) % 360; }
  return h;
}
function todayDeadline(dateStr, cfg){
  const d = new Date(dateStr + 'T00:00:00');
  d.setHours(cfg.hour, cfg.minute, 0, 0);
  return d;
}
function todayStart(dateStr, cfg){
  const d = new Date(dateStr + 'T00:00:00');
  d.setHours(cfg.startHour, cfg.startMinute, 0, 0);
  return d;
}

function myEntryKey(date){ return 'ladder-team-my-entry-' + date; }
function loadMyEntryLocal(date){
  try{ const raw = localStorage.getItem(myEntryKey(date)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveMyEntryLocal(date, entry){
  try{ localStorage.setItem(myEntryKey(date), JSON.stringify(entry)); } catch(e){}
}
function clearMyEntryLocal(date){
  try{ localStorage.removeItem(myEntryKey(date)); } catch(e){}
}

let unsubTeams = null, unsubDraw = null, unsubConfig = null, unsubRoster = null;

function attachDateListeners(date){
  if(unsubTeams) unsubTeams();
  if(unsubDraw) unsubDraw();
  unsubTeams = onValue(ref(db, `teams/${date}`), (snap) => {
    const val = snap.val() || {};
    state.teams = Object.entries(val).map(([id, v]) => ({ id, ...v }));
    render();
    maybeRunDraw();
  });
  unsubDraw = onValue(ref(db, `draw/${date}`), (snap) => {
    state.draw = snap.val();
    render();
  });
}

function attachConfigListener(){
  if(unsubConfig) unsubConfig();
  unsubConfig = onValue(ref(db, 'config'), (snap) => {
    state.config = snap.val() || { startHour: 9, startMinute: 0, hour: 11, minute: 0, cap: CAP_DEFAULT, winCap: WINCAP_DEFAULT };
    render();
  });
}

function attachRosterListener(){
  if(unsubRoster) unsubRoster();
  unsubRoster = onValue(ref(db, 'roster'), (snap) => {
    state.roster = snap.val() || { entries: [] };
    render();
  });
}

function switchToDate(date){
  state.date = date;
  state.teams = [];
  state.draw = null;
  state.myEntry = loadMyEntryLocal(date);
  attachDateListeners(date);
  render();
}

function loadAll(){
  switchToDate(todayStr());
  attachConfigListener();
  attachRosterListener();
}

function totalCount(teams){ return teams.reduce((s,t)=>s+t.count, 0); }

let drawInFlight = false;
async function maybeRunDraw(){
  const nowDate = todayStr();
  if(nowDate !== state.date){ switchToDate(nowDate); return; }
  if(state.draw || drawInFlight) return;
  const sum = totalCount(state.teams);
  const dl = todayDeadline(state.date, state.config);
  const deadlinePassed = Date.now() >= dl.getTime();
  if(sum >= state.config.cap || (deadlinePassed && state.teams.length > 0)){
    await runDraw();
  }
}

async function runDraw(){
  drawInFlight = true;
  try{
    const lockRef = ref(db, `drawLock/${state.date}`);
    const lockResult = await runTransaction(lockRef, (current) => current ? undefined : true);
    if(!lockResult.committed) return;

    const snap = await get(ref(db, `teams/${state.date}`));
    const val = snap.val() || {};
    let list = Object.entries(val).map(([id, v]) => ({ id, ...v }));
    list.sort((a,b)=>a.ts-b.ts);

    const ids = list.map(t=>t.id);
    for(let i = ids.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    const byId = {}; list.forEach(t => byId[t.id] = t);
    const winners = [];
    let running = 0;
    ids.forEach(id => {
      const t = byId[id];
      if(running + t.count <= state.config.winCap){
        const start = running + 1;
        running += t.count;
        const end = running;
        winners.push({ id, start, end, count: t.count });
      }
    });
    // keep display order = the order teams were fit in (matches start ascending)
    winners.sort((a,b)=>a.start-b.start);

    const result = { date: state.date, drawnAt: new Date().toISOString(), winners, winTotal: running };
    await set(ref(db, `draw/${state.date}`), result);
  } finally {
    drawInFlight = false;
  }
}

async function handleJoin(selector, count){
  count = parseInt(count, 10);
  state.errorMsg = null;

  const rosterEntries = (state.roster && state.roster.entries) || [];
  const useRoster = rosterEntries.length > 0;

  let teamName, deptKey = null, maxAllowed = null;
  if(useRoster){
    const entry = rosterEntries.find(en => en.key === selector);
    if(!entry){ state.errorMsg = '부서·팀을 선택해주세요.'; render(); return; }
    teamName = `${entry.dept} ${entry.team}`;
    deptKey = entry.key;
    maxAllowed = entry.max;
  } else {
    teamName = (selector || '').trim().slice(0, 24);
    if(!teamName){ state.errorMsg = '팀명을 입력해주세요.'; render(); return; }
  }

  if(!count || count < 1){ state.errorMsg = '인원수를 정확히 입력해주세요.'; render(); return; }
  if(maxAllowed && count > maxAllowed){ state.errorMsg = `이 부서·팀은 최대 ${maxAllowed}명까지만 신청할 수 있습니다.`; render(); return; }

  const st = todayStart(state.date, state.config);
  if(Date.now() < st.getTime()){ state.errorMsg = `오늘 접수는 ${String(state.config.startHour).padStart(2,'0')}:${String(state.config.startMinute).padStart(2,'0')}부터 시작됩니다.`; render(); return; }

  const dl = todayDeadline(state.date, state.config);
  if(Date.now() >= dl.getTime()){ state.errorMsg = '오늘 접수가 마감되었습니다.'; render(); return; }

  state.busy = true; render();

  try{
    // duplicate check against the freshest team list (race-safety net —
    // the dropdown already filters out taken departments in normal use)
    const teamsSnap = await get(ref(db, `teams/${state.date}`));
    const existing = Object.values(teamsSnap.val() || {});
    const dup = useRoster
      ? existing.find(t => t.deptKey === deptKey)
      : existing.find(t => t.team.trim().toLowerCase() === teamName.toLowerCase());
    if(dup){
      state.errorMsg = useRoster ? '이미 접수된 부서·팀입니다.' : '이미 접수된 팀명입니다. 팀당 한 번만 신청할 수 있어요.';
      state.busy = false; render(); return;
    }

    const cap = state.config.cap;
    const totalsRef = ref(db, `totals/${state.date}`);
    const txResult = await runTransaction(totalsRef, (current) => {
      current = current || 0;
      if(current + count > cap) return;
      return current + count;
    });

    if(!txResult.committed){
      const snap = await get(totalsRef);
      const cur = snap.val() || 0;
      const remaining = cap - cur;
      state.errorMsg = remaining <= 0
        ? `정원 ${cap}명이 마감되었습니다.`
        : `잔여 인원(${remaining}명)보다 신청 인원이 많습니다.`;
    } else {
      const newRef = push(ref(db, `teams/${state.date}`));
      const payload = { team: teamName, count, ts: Date.now() };
      if(deptKey) payload.deptKey = deptKey;
      await set(newRef, payload);
      state.myEntry = { id: newRef.key, team: teamName, count };
      saveMyEntryLocal(state.date, state.myEntry);
    }
  } catch(e){
    state.errorMsg = '접수 중 문제가 발생했습니다. 다시 시도해주세요.';
  }

  state.busy = false;
  render();
  await maybeRunDraw();
}

async function forceDraw(){ if(!state.draw) await runDraw(); }

function sanitizeExcelCell(v){
  return String(v == null ? '' : v).trim();
}

function parseRosterFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = window.XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
        const entries = [];
        rows.forEach((row) => {
          if(!row || row.length < 3) return;
          const dept = sanitizeExcelCell(row[0]);
          const team = sanitizeExcelCell(row[1]);
          const max = parseInt(row[2], 10);
          if(!dept || !team || !max || max < 1) return; // also skips the header row
          entries.push({ key: `${dept}::${team}`, dept, team, max });
        });
        resolve(entries);
      } catch(err){ reject(err); }
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsArrayBuffer(file);
  });
}

    <div class="admin-status" style="margin-top:6px;">정원·당첨 인원 변경은 오늘 이후 접수부터 적용되며, 이미 접수된 팀·완료된 추첨에는 영향을 주지 않습니다.</div>

    <h3 style="margin-top:22px;">부서·팀 명단 (엑셀)</h3>
    <div class="admin-status">현재 저장된 명단: <b style="color:var(--led-amber);">${rosterCount}건</b>${rosterCount>0 ? ' · 접수 화면이 드롭다운 방식으로 동작 중' : ' · 명단이 없으면 자유 입력 방식으로 동작'}</div>
    <div class="field" style="margin-top:10px;"><label>엑셀 업로드 (1열: 부서명, 2열: 팀명, 3열: 인원 상한 — 1행은 머리글로 취급되어 건너뜁니다)</label>
      <input type="file" id="rosterFile" accept=".xlsx,.xls"></div>
    ${state.rosterUploadMsg ? `<div class="msg">${escapeHTML(state.rosterUploadMsg)}</div>` : ''}
    <button class="btn btn-ghost small-btn" id="rosterSaveBtn" ${state.rosterPreview ? '' : 'disabled'}>명단 저장 (기존 명단을 교체합니다)</button>
    ${rosterCount>0 ? `<button class="btn btn-ghost small-btn" id="rosterClearBtn" style="margin-top:8px;">명단 삭제 (자유 입력 방식으로 전환)</button>` : ''}

    ${state.confirmForceDraw ? `
      <div class="msg">현재 접수 기준으로 즉시 추첨합니다. 되돌릴 수 없어요. 진행할까요?</div>
      <button class="btn btn-danger small-btn" id="forceDrawYes" style="margin-top:6px;">예, 지금 추첨</button>
      <button class="btn btn-ghost small-btn" id="forceDrawNo" style="margin-top:6px;">취소</button>
    ` : `<button class="btn btn-danger small-btn" id="forceDrawBtn" style="margin-top:20px;" ${state.draw?'disabled':''}>${state.draw?'이미 추첨됨':'지금 즉시 추첨'}</button>`}

    ${state.confirmReset ? `
      <div class="msg">오늘 접수·추첨 결과를 모두 삭제합니다. 진행할까요?</div>
      <button class="btn btn-danger small-btn" id="resetYes" style="margin-top:6px;">예, 초기화</button>
      <button class="btn btn-ghost small-btn" id="resetNo" style="margin-top:6px;">취소</button>
    ` : `<button class="btn btn-ghost small-btn" id="resetBtn" style="margin-top:10px;">오늘 접수 초기화</button>`}
  </div>`;

  document.getElementById('saveDeadlineBtn').onclick = () => {
    const sv = document.getElementById('startInput').value.split(':');
    const dv = document.getElementById('deadlineInput').value.split(':');
    const cap = parseInt(document.getElementById('capInput').value, 10);
    const winCap = parseInt(document.getElementById('winCapInput').value, 10);
    if(!cap || cap < 1 || !winCap || winCap < 1){
      state.configMsg = '정원과 당첨 인원은 1 이상의 숫자로 입력해주세요.';
      render();
      return;
    }
    if(winCap > cap){
      state.configMsg = '당첨 인원은 전체 정원보다 클 수 없습니다.';
      render();
      return;
    }
    const startMinutesTotal = parseInt(sv[0],10)*60 + parseInt(sv[1],10);
    const endMinutesTotal = parseInt(dv[0],10)*60 + parseInt(dv[1],10);
    if(startMinutesTotal >= endMinutesTotal){
      state.configMsg = '신청 시작 시각은 마감 시각보다 빨라야 합니다.';
      render();
      return;
    }
    saveConfig(parseInt(sv[0],10), parseInt(sv[1],10), parseInt(dv[0],10), parseInt(dv[1],10), cap, winCap);
  };

  document.getElementById('rosterFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const entries = await parseRosterFile(file);
      if(entries.length === 0){
        state.rosterPreview = null;
        state.rosterUploadMsg = '인식된 데이터가 없습니다. 1열 부서명, 2열 팀명, 3열 인원(숫자) 형식인지 확인해주세요.';
      } else {
        state.rosterPreview = entries;
        state.rosterUploadMsg = `${entries.length}건 인식됨. "명단 저장"을 눌러 확정하세요.`;
      }
    } catch(err){
      state.rosterPreview = null;
      state.rosterUploadMsg = '엑셀 파일을 읽는 중 문제가 발생했습니다. 파일 형식을 확인해주세요.';
    }
    render();
  });

  const rosterSaveBtn = document.getElementById('rosterSaveBtn');
  if(rosterSaveBtn) rosterSaveBtn.onclick = () => {
    if(state.rosterPreview) saveRoster(state.rosterPreview);
  };
  const rosterClearBtn = document.getElementById('rosterClearBtn');
  if(rosterClearBtn) rosterClearBtn.onclick = () => { clearRoster(); };

  if(state.confirmForceDraw){
    document.getElementById('forceDrawYes').onclick = () => { state.confirmForceDraw = false; forceDraw(); };
    document.getElementById('forceDrawNo').onclick = () => { state.confirmForceDraw = false; render(); };
  } else {
    const btn = document.getElementById('forceDrawBtn');
    if(btn) btn.onclick = () => { state.confirmForceDraw = true; render(); };
  }

  if(state.confirmReset){
    document.getElementById('resetYes').onclick = () => { state.confirmReset = false; resetToday(); };
    document.getElementById('resetNo').onclick = () => { state.confirmReset = false; render(); };
  } else {
    document.getElementById('resetBtn').onclick = () => { state.confirmReset = true; render(); };
  }
}

loadAll();
// Real-time updates arrive via the onValue listeners above. This interval only
// (a) detects a new day rolling over, and (b) checks whether the deadline
// time has passed even when no new registration triggers a data change.
setInterval(() => {
  const nowDate = todayStr();
  if(nowDate !== state.date){ switchToDate(nowDate); return; }
  if(!state.draw) maybeRunDraw();
}, 5000);
</script>
</body>
</html>
